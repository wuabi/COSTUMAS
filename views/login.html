<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COSTUMAS - Iniciar Sesión</title>
        <link rel="stylesheet" href="../styles/login.css">
    </head>

    <body>
        <main class="login-container">
            <section class="login-container">
                <img src="..\assets\logo-costumas.png" alt="Logo COSTUMAS" class="logo">

            </section>
            <section class="login-form">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" placeholder="Ingrese su usuario" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                    </div>

                    <p id="loginMessage"></p>

                    <button type="submit" id="btnLogin">Iniciar sesión</button>

                    <div class="remember-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe">

                        <label for="rememberMe">Recordarme</label>
                    </div>
                </form>
            </section>
        </main>

        <script src="../controllers/login.js"></script>
    </body>
</html>
